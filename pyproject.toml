[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "linguarelay"
version = "0.1.0"
description = "A secure, resumable pipeline for translating authorized media."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "defusedxml>=0.7,<1",
  "Pillow>=11.0,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]

[project.scripts]
linguarelay = "linguarelay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/linguarelay"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
