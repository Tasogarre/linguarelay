name: CI

on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  # Supersede PR revisions; every trunk run keeps its own group.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt == 1 && 'current' || format('rerun-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PROJECT_ENVIRONMENT: /tmp/linguarelay-venv
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Run tests
        run: uv run pytest -q

      - name: Build distributions
        run: uv build --no-sources
